<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Shopping List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- Navigation -->
    <nav
      class="flex justify-between align-center py-4 px-10 bg-gray-300 text-black text-bold"
    >
      <div class="">
        <h1>Logo</h1>
      </div>
      <div class="cta">
        <button class="py-1 px-3 bg-gray-400 text-white font-bold rounded">
          Create List
        </button>
      </div>
    </nav>

    <!-- main content -->
    <main class="flex justify-center">
      <div class="max-w-md bg-gray-100 p-3">
        <!-- Form for adding tasks -->
        <form
          action=""
          id="createList"
          class="flex justify-center align-center py-3 gap-2"
        >
            <input
              type="text"
              name="item"
              id="item"
              placeholder="Enter item to get..."
              required
              class="border border-gray-5 rounded py-1 px-3"
            />
            <button
              type="submit"
              class="border border-gray-5 rounded py-2 px-3"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="1em"
                height="1em"
                viewBox="0 0 24 24"
              >
                <path d="M0 0h24v24H0z" fill="none" />
                <path
                  fill="#514f4f"
                  d="m19.77 4.93l1.4 1.4L8.43 19.07l-5.6-5.6l1.4-1.4l4.2 4.2zm0-2.83L8.43 13.44l-4.2-4.2L0 13.47l8.43 8.43L24 6.33z"
                />
              </svg>
            </button>
        </form>

        <!-- Item list -->
        <div class="flex flex-col justify-center gap-3" id="itemContainer">
         <!-- Items will be  -->
         <!-- Items will be  -->
        </div>

        <!-- Clear button -->
         <button class="w-full p-2 bg-red-500 text-white mt-4 rounded">Clear All</button>
      </div>
    </main>
    <footer></footer>

    <script src="./app.js"></script>
  </body>
</html>
