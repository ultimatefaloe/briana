<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Shopping List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- Navigation -->
    <nav
      class="flex justify-between align-center py-4 px-10 bg-gray-300 text-black text-bold"
    >
      <div class="">
        <h1><a href="./index.html">Logo</a></h1>
      </div>
      <div class="cta">
        <a
          href="ajax.html"
          class="py-1 px-3 bg-gray-400 text-white font-bold rounded"
        >
          Ajax
        </a>
      </div>
    </nav>

    <!-- main content -->
    <main class="flex justify-center">
      <div class="max-w-md bg-gray-100 p-3">
        <!-- Form for adding tasks -->
        <form
          action=""
          id="createList"
          class="flex justify-center align-center py-3 gap-2"
        >
          <input
            type="text"
            name="title"
            id="title"
            placeholder="Enter item to get..."
            required
            class="border border-gray-5 rounded py-1 px-3"
          />
          <button type="submit" class="border border-gray-5 rounded py-2 px-3">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 24 24"
            >
              <path d="M0 0h24v24H0z" fill="none" />
              <path
                fill="#514f4f"
                d="m19.77 4.93l1.4 1.4L8.43 19.07l-5.6-5.6l1.4-1.4l4.2 4.2zm0-2.83L8.43 13.44l-4.2-4.2L0 13.47l8.43 8.43L24 6.33z"
              />
            </svg>
          </button>
        </form>

        <!-- Item list -->
        <div class="flex flex-col justify-center gap-3" id="itemContainer">
             <div
            className="bg-red-100 border border-red-300 rounded-lg p-4 flex items-start justify-between gap-4 shadow-sm"
            data-id="{id}"
          >
            <div className="flex-1">
              <h2 className="text-red-700 font-semibold text-lg">
                hello
              </h2>
              <p className="text-red-500 text-sm mt-2 leading-5">
                quia et suscipit suscipit recusandae consequuntur expedita et
                cum reprehenderit molestiae ut ut quas totam nostrum rerum est
                autem sunt rem eveniet architecto
              </p>
            </div>

            <div className="flex gap-2 shrink-0">
              <button
                className="bg-red-600 text-white px-3 py-1 rounded-md text-sm hover:bg-red-700 transition"
              >
                Edit
              </button>
              <button
                className="bg-red-200 text-red-700 px-3 py-1 rounded-md text-sm hover:bg-red-300 transition"
              >
                Delete
              </button>
            </div>
          </div>
        </div>

        <!-- Clear button -->
        <button class="w-full p-2 bg-red-500 text-white mt-4 rounded">
          Clear All
        </button>
      </div>
    </main>
    <footer></footer>

    <script src="./app.js"></script>
  </body>
</html>
